name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你预期发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 看到…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: "设备、系统、浏览器和版本"
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 截图或补充信息
